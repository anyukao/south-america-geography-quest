{% extends "base.html" %}
{% block title %}Вход учителя{% endblock %}
{% block content %}
<section class="content-card narrow">
  <div class="eyebrow">ПАНЕЛЬ УЧИТЕЛЯ</div>
  <h1>Вход для учителя</h1>
  <form method="post" class="quiz-form">
    <label>Пароль учителя<input type="password" name="password" required></label>
    <button class="button" type="submit">Войти</button>
  </form>
  <p class="small">Пароль задаётся в настройках хостинга через переменную TEACHER_PASSWORD.</p>
</section>
{% endblock %}
